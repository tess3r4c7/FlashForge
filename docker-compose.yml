services:
  postgres:
    image: postgres:17
    container_name: flashforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: flashforge
      POSTGRES_PASSWORD: flashforge_dev
      POSTGRES_DB: flashforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: