services:
  postgres:
    image: postgres:17
    container_name: flashforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: flashforge
      POSTGRES_PASSWORD: flashforge_dev
      POSTGRES_DB: flashforge

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    # The "-management" variant includes a web dashboard on port 15672
    image: rabbitmq:4-management
    container_name: flashforge-rabbitmq
    # RabbitMQ stores its data under a folder named after the hostname.
    # Fixing the hostname means queued messages survive container re-creation.
    hostname: flashforge-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: flashforge
      RABBITMQ_DEFAULT_PASS: flashforge_dev

    ports:
      - "5672:5672"   # AMQP — the protocol our app speaks
      - "15672:15672" # Management UI — http://localhost:15672

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashforge-redis
    restart: unless-stopped
    # --appendonly no / --save "": everything we keep in Redis (rate-limit
    # counters, cached products, cached idempotent responses) is disposable.
    # Postgres stays the source of truth, so Redis needs no persistence.
    # maxmemory + allkeys-lru: if memory fills up, evict the least recently
    # used keys instead of erroring - correct behaviour for a cache.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: